# The Wingnut Circus game server: live rooms (Durable Objects + WebSockets) and the daily leaderboard (D1).
# Deploy: npx wrangler deploy --config server/wrangler.toml
name = "wingnutcircus-server"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[d1_databases]]
binding = "DB"
database_name = "wingnut-circus"
database_id = "6a7f1504-86ef-4849-95bb-05b7bad59027"
