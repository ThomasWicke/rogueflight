<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RogueFlight</title>
<meta name="description" content="Roguelite flying-machine builder: build, fly, hit the quota.">
<meta name="theme-color" content="#33200f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RogueFlight">
</head>
<body>
<!-- ============ TITLE ============ -->
<section class="screen barn" id="title">
  <div class="bench titlebench">
    <div class="logo" role="img" aria-label="RogueFlight, the Flying Circus"><span class="l1">ROGUE</span><span class="l2">FLIGHT</span><span class="ribbon">The Flying Circus</span></div>
    <canvas id="titleCv" class="titlecv" aria-hidden="true"></canvas>
    <div id="titleBody" class="tbody"></div>
  </div>
</section>

<!-- ============ HANGAR ============ -->
<!-- the barn: the show poster on top, the workbench in the middle, the dealer / launch / decals bar at the thumb -->
<section class="screen barn" id="hangar" hidden>
  <div class="htop">
    <div class="chips left"><span class="chip cash" aria-label="Coins"><i class="cn"></i><b id="hCoins">0</b></span><span class="chip" id="hCeil" hidden></span></div>
    <div class="chips"><button class="chip help" id="hSound" type="button" aria-label="Sound on">&#9835;</button><button class="chip help" id="hHelp" type="button" aria-label="How to play">?</button></div>
  </div>
  <div class="poster" id="cstrip"></div>
  <div class="bench" id="bench"></div>
  <div class="hbar">
    <button class="tool" id="tShop" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5V4.6c0-.9.7-1.6 1.6-1.6h7.9l9 9-9.5 9.5z" fill="currentColor" stroke="#22283a" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.8" fill="#22283a"/></svg><span>Shop</span></button>
    <button class="big" id="launch" type="button">LAUNCH</button>
    <button class="tool" id="tMods" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 16.9 6.3 20l1.2-6.4L2.8 9.2l6.4-.8z" fill="currentColor" stroke="#22283a" stroke-width="2" stroke-linejoin="round"/></svg><span id="tModsL">Mods</span></button>
  </div>
</section>

<!-- the junk dealer (shop) and the decal board (mods) slide up over the barn -->
<div class="drawer" id="dealer" hidden role="dialog" aria-modal="true" aria-labelledby="dealerTitle">
  <div class="dr-scrim" id="dealerScrim"></div>
  <div class="dr-panel dealer">
    <div class="dr-grab" aria-hidden="true"></div>
    <div class="dr-head"><span class="label" id="dealerTitle">Shop</span><button class="dr-x" id="dealerX" type="button" aria-label="Close">&times;</button></div>
    <div class="dr-body" id="dealerBody"></div>
  </div>
</div>

<!-- ============ FLIGHT ============ -->
<section class="screen" id="flight" hidden>
  <canvas id="cv" aria-label="Your flying machine in flight"></canvas>
  <div class="hud">
    <div class="hrow">
      <div class="dist" id="fDist">0 m</div>
      <div class="mini"><span id="fAlt">ALT 0 m</span><span id="fSpd">0 km/h</span><span id="fTime" class="ftime" aria-label="Flight time left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><b>5:00</b></span><span id="fTs" class="ffw" hidden></span></div>
    </div>
    <div class="srow"><span>SCORE <b id="fScore">0</b> <span class="m" id="fMult">×1.0</span></span><span class="need" id="fNeed"></span></div>
    <div class="fuelrow"><span>FUEL</span><div class="fuel"><i id="fFuel"></i></div></div>
    <div class="wxhud" id="fWx" hidden></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ctrl">
    <div class="pad">
      <button id="bUp" type="button" aria-label="Nose up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>NOSE UP</button>
      <button id="bDown" type="button" aria-label="Nose down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>NOSE DOWN</button>
    </div>
    <div class="rpad">
      <button id="bPop" type="button" aria-label="Pop balloons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 6 6c0 4-3.5 7-6 7s-6-3-6-7a6 6 0 0 1 6-6z"/><path d="M12 16v5M3 4l3 2M21 4l-3 2M2 11h2M20 11h2"/></svg>POP</button>
      <div id="thr" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0"><i id="thrFill"></i><b id="thrKnob"></b><span id="thrVal">100%</span></div>
    </div>
  </div>
</section>

<!-- ============ PARTS PACKS ============ -->
<section class="screen blue packs" id="packs" hidden aria-label="Parts packs">
  <div class="pk-top"><span class="label" id="pkLabel"></span><button class="ghost" id="pkSkip" type="button">Open all</button></div>
  <div class="pk-stage" id="pkStage"></div>
  <div class="pk-tray" id="pkTray"></div>
  <div class="pk-cta"><button class="big" id="pkDone" type="button" hidden>To the hangar</button></div>
</section>

<!-- ============ HOW TO PLAY ============ -->
<div class="drawer" id="guide" hidden role="dialog" aria-modal="true" aria-label="How to play">
  <div class="dr-scrim" id="grScrim"></div>
  <div class="dr-panel">
    <div class="dr-grab" aria-hidden="true"></div>
    <div class="dr-head"><span class="label">How to play · <span id="grCount"></span></span><button class="dr-x" id="grClose" type="button" aria-label="Close">×</button></div>
    <div class="gr-track" id="grTrack"></div>
    <div class="dr-foot"><button class="ghost" id="grPrev" type="button">Back</button><div class="gr-dots" id="grDots"></div><button class="big" id="grNext" type="button">Next</button></div>
  </div>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
