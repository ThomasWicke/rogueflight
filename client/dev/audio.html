<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RogueFlight audio</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #22283a; --paper: #f3e7ce; --paper2: #e6d4ae; --canvas: #fbf5e8; --red: #d2402f; --brass: #e9a93b; --teal: #3b9aa6; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 8px; }
  p { margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  button { font: inherit; font-weight: 700; padding: 10px 6px; border: 2px solid var(--ink); border-radius: 6px;
    background: var(--canvas); color: var(--ink); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button.on { background: var(--brass); }
  .wide { grid-column: span 2; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; max-width: 560px; }
  label > span { width: 120px; flex: none; }
  input[type=range] { flex: 1; min-width: 0; }
  output { width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 10px; text-align: right; border-bottom: 1px solid var(--paper2); }
  th:first-child, td:first-child { text-align: left; }
  .bad { color: var(--red); font-weight: 700; }
  #state { font-weight: 700; }
</style>
</head>
<body>
<h1>RogueFlight audio</h1>
<p>Any tap unlocks audio. Context: <span id="state">locked</span></p>
<label><input type="checkbox" id="mute"> Mute (persisted)</label>
<label><span>Music volume</span><input type="range" id="vmusic" min="0" max="1" step="0.01"><output></output></label>
<label><span>Sfx volume</span><input type="range" id="vsfx" min="0" max="1" step="0.01"><output></output></label>

<h2>Sfx</h2>
<div class="grid" id="sfx"></div>
<label><span>coin pitch</span><input type="range" id="o-pitch" min="0.5" max="3" step="0.01" value="1"><output></output></label>
<label><span>multStep step</span><input type="range" id="o-step" min="0" max="24" step="1" value="0"><output></output></label>
<label><span>cheer / touchdown intensity</span><input type="range" id="o-intensity" min="0" max="1" step="0.01" value="0.6"><output></output></label>
<label><span>creak amount</span><input type="range" id="o-amount" min="0" max="1" step="0.01" value="0.5"><output></output></label>
<div class="grid">
  <button class="wide" id="coinrun">Coin run ×6</button>
  <button class="wide" id="tally">Tally ×8 + slam</button>
  <button class="wide" id="windup">Catapult wind-up</button>
</div>

<h2>Music</h2>
<div class="grid" id="music">
  <button data-m="title">title</button><button data-m="hangar">hangar</button>
  <button data-m="flight">flight</button><button data-m="off" class="on">off</button>
</div>
<label><span>hype (flight)</span><input type="range" id="hype" min="0" max="1" step="0.01" value="0"><output></output></label>

<h2>Engine</h2>
<div class="grid"><button id="engine" class="wide">Engine: off</button></div>
<label><span>prop</span><input type="range" id="e-prop" min="0" max="1" step="0.01" value="0.7"><output></output></label>
<label><span>rocket</span><input type="range" id="e-rocket" min="0" max="1" step="0.01" value="0"><output></output></label>
<label><span>speed m/s</span><input type="range" id="e-speed" min="0" max="300" step="1" value="40"><output></output></label>
<label><span>fuel</span><input type="range" id="e-fuel" min="0" max="1" step="0.01" value="1"><output></output></label>
<label><span>alt m</span><input type="range" id="e-alt" min="0" max="20000" step="10" value="300"><output></output></label>

<h2>Levels</h2>
<p>Offline renders at full volume. Out = after compressor and limiter, raw = before. "end" above 0 means the render window cut the sound.</p>
<div class="grid"><button id="measure" class="wide">Measure all</button></div>
<div id="levels"></div>

<script type="module">
import { audio } from '../src/audio.js';

const $ = id => document.getElementById(id);
const val = id => +$(id).value;
// unlock on any gesture (iOS wants click / pointerup / touchend, not pointerdown)
document.addEventListener('pointerup', () => audio.unlock(), true);
document.addEventListener('click', () => audio.unlock(), true);
setInterval(() => { $('state').textContent = audio.state + (audio.muted ? ' (muted)' : ''); }, 250);

// range inputs show their value
for (const r of document.querySelectorAll('input[type=range]')) {
  const out = r.nextElementSibling, show = () => { out.textContent = r.value; };
  r.addEventListener('input', show); show();
}

// mute and volumes
$('mute').checked = audio.muted;
$('mute').onchange = e => audio.setMuted(e.target.checked);
$('vmusic').value = audio.volumes.music; $('vsfx').value = audio.volumes.sfx;
for (const id of ['vmusic', 'vsfx']) $(id).dispatchEvent(new Event('input'));
$('vmusic').oninput = e => { e.target.nextElementSibling.textContent = e.target.value; audio.setVolumes({ music: +e.target.value }); };
$('vsfx').oninput = e => { e.target.nextElementSibling.textContent = e.target.value; audio.setVolumes({ sfx: +e.target.value }); };

// sfx buttons
const opts = () => ({ pitch: val('o-pitch'), step: val('o-step'), intensity: val('o-intensity'), amount: val('o-amount') });
for (const name of audio.sfxNames) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { audio.unlock(); audio.sfx(name, opts()); };
  $('sfx').appendChild(b);
}
const later = (ms, fn) => setTimeout(fn, ms);
$('coinrun').onclick = () => { for (let i = 0; i < 6; i++) later(i * 90, () => audio.sfx('coin', { pitch: Math.pow(2, i / 12) })); };
$('tally').onclick = () => { for (let i = 0; i < 8; i++) later(i * 140, () => audio.sfx('multStep', { step: i })); later(8 * 140 + 120, () => audio.sfx('slam')); };
$('windup').onclick = () => { for (let i = 0; i < 6; i++) later(i * 170, () => audio.sfx('creak', { amount: i / 5 })); later(6 * 170 + 80, () => audio.sfx('launch')); };

// music
$('music').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  audio.unlock(); audio.music(b.dataset.m);
  for (const x of $('music').children) x.classList.toggle('on', x === b);
  if (b.dataset.m === 'flight') audio.hype(val('hype'));
};
$('hype').addEventListener('input', () => audio.hype(val('hype')));

// engine: call audio.engine every frame while on
let engineOn = false;
$('engine').onclick = () => {
  engineOn = !engineOn;
  $('engine').textContent = 'Engine: ' + (engineOn ? 'on' : 'off');
  $('engine').classList.toggle('on', engineOn);
  if (engineOn) requestAnimationFrame(frame); else audio.stopEngine();
};
function frame() {
  if (!engineOn) return;
  audio.engine({ prop: val('e-prop'), rocket: val('e-rocket'), speed: val('e-speed'), fuel: val('e-fuel'), alt: val('e-alt') });
  requestAnimationFrame(frame);
}

// offline level measurements
const SFX_OPTS = { coin: { pitch: 1 }, cheer: { intensity: 1 }, creak: { amount: 1 }, touchdown: { intensity: 1 }, multStep: { step: 12 } };
const LONG = { crash: 3.2, cheer: 3.4, sad: 3, fireworks: 2.2, thermal: 1.6 };
async function measureAll() {
  const rows = [];
  for (const name of audio.sfxNames) {
    const o = SFX_OPTS[name] || {}, seconds = LONG[name] || 1.5;
    const [out, raw] = [await audio._render('sfx', name, { o, seconds }), await audio._render('sfx', name, { o, seconds, raw: true })];
    rows.push(['sfx ' + name, out, raw]);
  }
  for (const [mode, hype] of [['title'], ['hangar'], ['flight', 0], ['flight', 0.5], ['flight', 0.8], ['flight', 1]]) {
    const arg = { mode, hype }, seconds = 9;
    rows.push([`music ${mode}${hype != null ? ' ' + hype : ''}`, await audio._render('music', arg, { seconds }), await audio._render('music', arg, { seconds, raw: true })]);
  }
  for (const [label, st] of [['prop idle', { prop: 0.1, speed: 10, fuel: 1 }], ['prop full', { prop: 1, speed: 60, fuel: 1 }],
    ['prop sputter', { prop: 0.8, speed: 40, fuel: 0.03 }], ['rocket full', { rocket: 1, speed: 120, fuel: 1 }],
    ['wind 90', { speed: 90 }], ['all max', { prop: 1, rocket: 1, speed: 300, fuel: 1 }]]) {
    rows.push(['engine ' + label, await audio._render('engine', st, { seconds: 2.5 }), await audio._render('engine', st, { seconds: 2.5, raw: true })]);
  }
  return rows;
}
window.measureAll = measureAll;   // also used by headless checks
$('measure').onclick = async () => {
  $('levels').textContent = 'Rendering…';
  const rows = await measureAll();
  const cell = (v, bad) => `<td class="${bad ? 'bad' : ''}">${v}</td>`;
  $('levels').innerHTML = '<table><tr><th>sound</th><th>out peak</th><th>out rms</th><th>raw peak</th><th>dur s</th><th>end</th></tr>' +
    rows.map(([n, o, r]) => `<tr><td>${n}</td>${cell(o.peak, o.peak > 0.98)}${cell(o.rms)}${cell(r.peak, r.peak > 0.8)}${cell(o.dur)}${cell(o.end, !n.startsWith('music') && !n.startsWith('engine') && o.end > 0.002)}</tr>`).join('') + '</table>';
};
</script>
</body>
</html>
